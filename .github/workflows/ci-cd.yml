# =============================================================================
# turnstay_webhook_sdk SDK CI/CD Pipeline
# =============================================================================
# Flow: static-analysis → test (3.10/3.11) + security → publish to CodeArtifact on main
#
# Configuration: PROJECT CONFIG env block below. Do not edit STANDARD PIPELINE.
# =============================================================================

name: 'turnstay_webhook_sdk SDK CI/CD Pipeline'

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

# =============================================================================
# PROJECT CONFIG — edit only this section when onboarding a new package/service
# =============================================================================
env:
  PACKAGE_DISPLAY_NAME: 'turnstay_webhook_sdk'
  COVERAGE_PACKAGE: 'turnstay_webhooks'
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.8.3'
  CHECKOUT_ACTION_VERSION: 'v6'
  UPLOAD_ARTIFACT_VERSION: 'v4'
  USE_RUFF: 'true'
  USE_FLAKE8: 'false'
  SKIP_BANDIT_IN_STATIC: 'false'

# =============================================================================
# STANDARD PIPELINE — do not edit per repo
# =============================================================================
jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python and Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}
          working-directory: '.'

      - name: Run static analysis
        uses: ./.github/actions/static-analysis
        with:
          working-directory: '.'
          use-ruff: ${{ env.USE_RUFF }}
          use-flake8: ${{ env.USE_FLAKE8 }}
          skip-bandit: ${{ env.SKIP_BANDIT_IN_STATIC }}

  test:
    needs: static-analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python and Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ matrix.python-version }}
          poetry-version: ${{ env.POETRY_VERSION }}
          working-directory: '.'

      - name: Run tests
        shell: bash
        working-directory: '.'
        run: |
          echo "Running tests for Python ${{ matrix.python-version }}..."
          poetry run pytest tests/ -v \
            --cov=${{ env.COVERAGE_PACKAGE }} \
            --cov-report=term-missing \
            --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7

  security:
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python and Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}
          working-directory: '.'

      - name: Run security scan with bandit
        shell: bash
        working-directory: '.'
        run: |
          poetry run bandit -r . -f txt || true

  publish:
    needs: [static-analysis, test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python and Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}
          working-directory: '.'

      - name: Publish to CodeArtifact
        uses: ./.github/actions/publish-pypi
        with:
          working-directory: '.'
          aws-access-key-id: ${{ secrets.PYPI_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PYPI_AWS_SECRET_ACCESS_KEY }}
