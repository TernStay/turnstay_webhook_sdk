name: 'Publish to Private PyPI'
description: 'Build and publish Python package to private PyPI server'
inputs:
  working-directory:
    description: 'Working directory for the action'
    required: false
    default: '.'
  role-arn:
    description: 'IAM role ARN (OIDC) with CodeArtifact publish access. Requires the calling job to set permissions.id-token: write.'
    required: true
  aws-region:
    description: 'AWS region for CodeArtifact'
    required: false
    default: 'us-east-1'
  domain:
    description: 'CodeArtifact domain'
    required: false
    default: 'ternstay'
  domain-owner:
    description: 'CodeArtifact domain owner'
    required: false
    default: '697839196252'
  repository:
    description: 'CodeArtifact repository'
    required: false
    default: 'ternstay00'

outputs:
  package:
    description: Package name
    value: ${{ steps.publish.outputs.package }}
  version:
    description: Version from pyproject.toml
    value: ${{ steps.publish.outputs.version }}
  previous-version:
    description: Latest version in CodeArtifact before publish (if any)
    value: ${{ steps.publish.outputs.previous-version }}
  published:
    description: 'true if a new version was uploaded, skipped if already existed'
    value: ${{ steps.publish.outputs.published }}

runs:
  using: 'composite'
  steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-arn }}
        role-session-name: gha-sdk-codeartifact-publish
        aws-region: ${{ inputs.aws-region }}

    - name: Build package
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "🔨 Building package..."
        poetry build

    - name: Install twine
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "📦 Installing twine..."
        python -m pip install --upgrade twine

    - name: Configure CodeArtifact authentication
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "🔐 Configuring CodeArtifact authentication..."
        aws codeartifact login --tool twine --domain ${{ inputs.domain }} --domain-owner ${{ inputs.domain-owner }} --repository ${{ inputs.repository }} --region ${{ inputs.aws-region }}

    - name: Publish to CodeArtifact
      id: publish
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        VERSION=$(poetry version -s)
        PACKAGE=$(poetry run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['poetry']['name'])")
        echo "Package: ${PACKAGE}@${VERSION}"

        PREVIOUS=$(aws codeartifact list-package-versions \
          --domain ${{ inputs.domain }} \
          --domain-owner ${{ inputs.domain-owner }} \
          --repository ${{ inputs.repository }} \
          --format pypi \
          --package "$PACKAGE" \
          --region ${{ inputs.aws-region }} \
          --sort-by PUBLISH_TIME \
          --max-results 1 \
          --query 'versions[0].version' \
          --output text 2>/dev/null || true)
        if [ "$PREVIOUS" = "None" ] || [ -z "$PREVIOUS" ]; then
          PREVIOUS=""
        fi

        {
          echo "package=${PACKAGE}"
          echo "version=${VERSION}"
          echo "previous-version=${PREVIOUS}"
        } >> "$GITHUB_OUTPUT"

        EXISTING=$(aws codeartifact list-package-versions \
          --domain ${{ inputs.domain }} \
          --domain-owner ${{ inputs.domain-owner }} \
          --repository ${{ inputs.repository }} \
          --format pypi \
          --package "$PACKAGE" \
          --region ${{ inputs.aws-region }} \
          --query "versions[?version=='${VERSION}'].version" \
          --output text 2>/dev/null || true)

        if [ -n "$EXISTING" ] && [ "$EXISTING" != "None" ]; then
          echo "✅ ${PACKAGE}@${VERSION} already published to CodeArtifact — skipping upload"
          echo "published=skipped" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "🚀 Publishing ${PACKAGE}@${VERSION} to CodeArtifact..."
        set +e
        UPLOAD_OUT=$(python -m twine upload --repository codeartifact dist/* 2>&1)
        UPLOAD_RC=$?
        set -e
        if [ $UPLOAD_RC -eq 0 ]; then
          echo "$UPLOAD_OUT"
          echo "✅ Published successfully"
          echo "published=true" >> "$GITHUB_OUTPUT"
        elif echo "$UPLOAD_OUT" | grep -qiE '409|Conflict|already exists'; then
          echo "$UPLOAD_OUT"
          echo "✅ Version already published (409) — treating as success"
          echo "published=skipped" >> "$GITHUB_OUTPUT"
          exit 0
        else
          echo "$UPLOAD_OUT"
          echo "published=false" >> "$GITHUB_OUTPUT"
          exit $UPLOAD_RC
        fi

