# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# TurnStay standard: max 5 open PRs (3 app + 1 infra + 1 actions), Monday SAST, no auto-rebase.

version: 2
updates:
  # ── Root (Poetry) ──
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Africa/Johannesburg"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    allow:
      - dependency-type: "direct"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"

  # ── GitHub Actions ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Africa/Johannesburg"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
      - "ci"
